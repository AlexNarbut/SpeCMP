# Качество кода: docs/code-quality.md. Активация: pre-commit install (типы хуков — default_install_hook_types)
# Spotless проверяет всё дерево (pre-commit перед хуками прячет неиндексированные правки, так что это коммитимое
# состояние). Остальные проверки перед коммитом — руками: docs/code-quality.md → «Команды».
default_install_hook_types: [pre-commit, pre-push, pre-merge-commit]
repos:
  # Агентские конфиги: источник — .ai/; хук падает, если сгенерированное разошлось с .ai/ (ручная правка, скилл
  # в обход .ai/skills, забыли перегенерировать или добавить новые файлы). Исправление — закоммитить результат .ai/generate.sh.
  - repo: local
    hooks:
      - id: ai-generate
        name: ai configs (.ai/generate.sh)
        entry: .ai/generate.sh --check
        language: system
        files: ^(\.ai/|\.claude/(skills|agents)/|\.claude/settings\.json$|scripts/agent-hooks/|\.agents/|\.codex/|\.gemini/|\.grok/|CLAUDE\.md$|AGENTS\.md$|GEMINI\.md$|.*/AGENTS\.md$)
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: spotless-check
        name: spotless (ktlint + compose-rules)
        entry: ./gradlew spotlessCheck
        language: system
        files: \.(kt|kts)$
        pass_filenames: false
        stages: [pre-commit]
      - id: ui-audit
        name: ui-audit (design-system bypasses vs baseline)
        entry: ./gradlew uiAudit
        language: system
        files: \.kt$
        pass_filenames: false
        stages: [pre-commit]
      - id: serial-name-check
        name: "@SerialName on every @Serializable (docs/patterns.md)"
        entry: config/hooks/check-serial-name.sh
        language: script
        files: \.kt$
        stages: [pre-commit]
      - id: strings-check
        name: "strings in core/localization, key format, same keys in every language (docs/localization.md)"
        entry: config/hooks/check-strings.py
        language: script
        files: (composeResources/.*\.xml|check-strings\.py)$
        pass_filenames: false
        stages: [pre-commit]
      - id: architecture-checks
        name: detekt, Konsist, CPD, module graph, detekt-rules tests
        entry: ./gradlew --continue detektCheck :quality:konsist:test :quality:detekt-rules:test cpdCheck assertModuleGraph
        language: system
        files: (\.(kt|kts)$|gradle/libs\.versions\.toml$|^config/detekt/|^quality/)
        pass_filenames: false
        stages: [pre-push]
      # В main/master — только develop: слияние другой ветки (pre-merge-commit) и пуш коммитов не из develop (pre-push).
      - id: master-from-develop-merge
        name: only develop merges into main/master
        entry: config/hooks/check-master-from-develop.sh merge
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-merge-commit]
      - id: master-from-develop-push
        name: only develop commits pushed to main/master
        entry: config/hooks/check-master-from-develop.sh push
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-push]
