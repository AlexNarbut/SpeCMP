# Perfetto-конфиг трейса старта (текстовый protobuf). Подаётся через stdin:
#   adb shell perfetto -c - --txt -o /data/misc/perfetto-traces/perf-bench.pftrace < perfetto-startup.cfg
# Срез: планировщик (состояния потоков), atrace-категории приложения и системы, статистика процессов.
# Длительность задаёт bench.sh через duration_ms (sed по плейсхолдеру).
buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_wakeup"
      ftrace_events: "sched/sched_process_exit"
      # Имена нового процесса и его потоков: без них trace_processor не свяжет главный поток с пакетом.
      ftrace_events: "sched/sched_process_exec"
      ftrace_events: "task/task_newtask"
      ftrace_events: "task/task_rename"
      ftrace_events: "power/suspend_resume"
      atrace_categories: "am"
      atrace_categories: "binder_driver"
      atrace_categories: "dalvik"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "wm"
      # Без atrace_apps: с runtime-tracing в debug-сборке app-atrace заставляет Compose писать секцию на каждый
      # composable, и трассируемый старт растягивается в 10 раз. Системные слайсы (bindApplication, Choreographer)
      # приходят по категориям am/view и без него. Имена composable — в композиционном трейсе (perfetto-compose.cfg).
    }
  }
}
data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 1000 }
  }
}
data_sources { config { name: "android.packages_list" } }
duration_ms: DURATION_PLACEHOLDER
