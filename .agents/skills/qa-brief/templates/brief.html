<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бриф QA</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --text: #1b1f24; --muted: #5c6670;
  --line: #dde1e6; --accent: #24407a; --accent-soft: #e3e9f5;
  --ok: #1e7a46; --ok-soft: #dff3e7; --bug: #b3261e; --bug-soft: #fbe3e1;
  --block: #8a1c7c; --block-soft: #f6e0f2; --skip: #6b6f76; --skip-soft: #eceef1;
  --new: #9a5b00; --new-soft: #fff0d6; --high: #b3261e;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1a1e23; --surface-2: #22272d; --text: #e7eaee; --muted: #9aa4ae;
    --line: #2e343b; --accent: #9db8ef; --accent-soft: #23314d;
    --ok: #6fd39a; --ok-soft: #173826; --bug: #ff8a80; --bug-soft: #3d1c1a;
    --block: #e79be0; --block-soft: #3a1c36; --skip: #a3a8ae; --skip-soft: #2a2e33;
    --new: #ffc46b; --new-soft: #3a2a10; --high: #ff8a80;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1a1e23; --surface-2: #22272d; --text: #e7eaee; --muted: #9aa4ae;
  --line: #2e343b; --accent: #9db8ef; --accent-soft: #23314d;
  --ok: #6fd39a; --ok-soft: #173826; --bug: #ff8a80; --bug-soft: #3d1c1a;
  --block: #e79be0; --block-soft: #3a1c36; --skip: #a3a8ae; --skip-soft: #2a2e33;
  --new: #ffc46b; --new-soft: #3a2a10; --high: #ff8a80;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  margin: 0; overflow-wrap: anywhere; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

header.top { padding: 32px 0 20px; }
.kicker { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; }
.summary { font-size: 16px; max-width: 820px; margin: 0 0 18px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 8px; }
.meta div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.meta dt { color: var(--muted); font-size: 12px; }
.meta dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

.bar {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 10px 0;
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.progress { flex: 1 1 260px; min-width: 220px; }
.progress .track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: flex; }
.progress .track span { display: block; height: 100%; }
.progress .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px;
  padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding-top: 20px; padding-bottom: 60px; }
nav.toc { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; }
nav.toc a {
  display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px;
  text-decoration: none; color: var(--text); font-size: 14px;
}
nav.toc a:hover { background: var(--surface-2); }
nav.toc .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
nav.toc .n.done { color: var(--ok); }
nav.toc .group { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin: 14px 10px 4px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.general { padding: 16px 20px; margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 8px 28px; }
.general h3 { margin: 4px 0 6px; font-size: 15px; }
.general ul { margin: 0 0 8px; padding-left: 18px; }

section.sec { margin-bottom: 36px; scroll-margin-top: 80px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec h2 { font-size: 22px; margin: 0; }
.sec .count { color: var(--muted); font-size: 13px; }
.sec .about { margin: 6px 0 12px; color: var(--muted); max-width: 820px; }
.blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-bottom: 14px; }
.block { padding: 12px 16px; }
.block h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.block ul { margin: 0; padding-left: 18px; }
.block li { margin: 2px 0; }
.date { color: var(--new); font-weight: 600; font-size: 13px; margin-right: 6px; white-space: nowrap; }
.limits { background: var(--surface-2); border-style: dashed; }

.case { padding: 14px 18px; margin-bottom: 10px; border-left: 4px solid var(--line); }
.case[data-status="ok"] { border-left-color: var(--ok); }
.case[data-status="bug"] { border-left-color: var(--bug); }
.case[data-status="block"] { border-left-color: var(--block); }
.case[data-status="skip"] { border-left-color: var(--skip); opacity: .75; }
.case-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.case-title { font-weight: 650; font-size: 16px; }
.case-id { color: var(--muted); font-weight: 500; font-size: 13px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.badge.new { background: var(--new-soft); color: var(--new); font-weight: 600; }
.badge.high { background: var(--bug-soft); color: var(--high); font-weight: 600; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin-top: 10px; }
.cols h5 { margin: 0 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.cols ol, .cols ul { margin: 0; padding-left: 20px; }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); }
.status { display: flex; gap: 4px; flex-wrap: wrap; }
.status button {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px;
  padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer;
}
.status button[aria-pressed="true"][data-v="ok"] { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 600; }
.status button[aria-pressed="true"][data-v="bug"] { background: var(--bug-soft); color: var(--bug); border-color: transparent; font-weight: 600; }
.status button[aria-pressed="true"][data-v="block"] { background: var(--block-soft); color: var(--block); border-color: transparent; font-weight: 600; }
.status button[aria-pressed="true"][data-v="skip"] { background: var(--skip-soft); color: var(--skip); border-color: transparent; font-weight: 600; }
textarea.comment {
  width: 100%; margin-top: 10px; min-height: 54px; resize: vertical; border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 10px; background: var(--bg); color: var(--text); font: inherit; font-size: 14px;
}
.hidden { display: none !important; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.empty { color: var(--muted); padding: 8px 0 0; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  nav.toc { position: static; max-height: none; }
  .cols { grid-template-columns: 1fr; }
  h1 { font-size: 24px; }
  .bar { position: static; }
  .progress { flex-basis: 100%; }
}
@media print {
  .bar, nav.toc, .status, textarea.comment:placeholder-shown { display: none !important; }
  .layout { grid-template-columns: 1fr; }
  body { background: #fff; }
  .case, .card { break-inside: avoid; box-shadow: none; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<div class="bar"><div class="wrap" id="bar"></div></div>
<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Разделы"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script id="brief-data" type="application/json">/*__BRIEF_DATA__*/</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("brief-data").textContent);
  var STATUS = [
    { v: "ok", label: "OK" }, { v: "bug", label: "Баг" }, { v: "block", label: "Блокер" }, { v: "skip", label: "Пропуск" }
  ];
  var STATUS_TEXT = { ok: "OK", bug: "Баг", block: "Блокер", skip: "Пропуск", "": "Не проверено" };
  var PRIORITY_TEXT = { high: "Важно", normal: "Обычный", low: "Низкий" };
  var storeKey = "qa-brief:" + (data.id || data.title);
  var results = load();
  var filter = { platform: "all", onlyNew: false, onlyHigh: false };

  document.title = data.title || "Бриф QA";

  function load() {
    try { return JSON.parse(localStorage.getItem(storeKey) || "{}") || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(storeKey, JSON.stringify(results)); } catch (e) { /* без хранилища — только в памяти */ }
  }
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "class") node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }
  function list(tag, items, render) {
    var node = el(tag);
    (items || []).forEach(function (it) { node.appendChild(render ? render(it) : el("li", { text: it })); });
    return node;
  }
  function toast(text) {
    var t = document.getElementById("toast");
    t.textContent = text; t.classList.add("show");
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function allCases() {
    var out = [];
    (data.sections || []).forEach(function (s) { (s.cases || []).forEach(function (c) { out.push({ sec: s, c: c }); }); });
    return out;
  }
  function statusOf(id) { return (results[id] && results[id].status) || ""; }
  function visible(c) {
    if (filter.onlyNew && !c.new) return false;
    if (filter.onlyHigh && c.priority !== "high") return false;
    if (filter.platform !== "all" && (c.platforms || []).indexOf(filter.platform) < 0) return false;
    return true;
  }

  // Шапка
  var meta = data.meta || {};
  var metaRows = [
    ["Охват", meta.scope], ["Период изменений", meta.period], ["Коммитов", meta.commits],
    ["Ветка · коммит", [meta.branch, meta.commit].filter(Boolean).join(" · ")],
    ["Версии сборок", meta.versions], ["Бриф составлен", meta.generated]
  ].filter(function (r) { return r[1] !== undefined && r[1] !== null && r[1] !== ""; });
  var kinds = { full: "Полная проверка", branch: "Проверка ветки", period: "Изменения за период" };
  var top = document.getElementById("top");
  top.appendChild(el("div", { class: "kicker", text: (kinds[meta.kind] || "Бриф") + " · SpeCMP" }));
  top.appendChild(el("h1", { text: data.title || "" }));
  if (data.summary) top.appendChild(el("p", { class: "summary", text: data.summary }));
  top.appendChild(el("dl", { class: "meta" }, metaRows.map(function (r) {
    return el("div", null, [el("dt", { text: r[0] }), el("dd", { text: String(r[1]) })]);
  })));

  // Панель: прогресс, фильтры, отчёт
  var bar = document.getElementById("bar");
  var progress = el("div", { class: "progress" }, [el("div", { class: "track" }), el("div", { class: "label" })]);
  bar.appendChild(progress);
  var platforms = ["all"];
  allCases().forEach(function (x) { (x.c.platforms || []).forEach(function (p) { if (platforms.indexOf(p) < 0) platforms.push(p); }); });
  var chips = el("div", { class: "chips", role: "group", "aria-label": "Платформа" });
  platforms.forEach(function (p) {
    var b = el("button", { class: "chip", type: "button", "aria-pressed": String(p === "all"), text: p === "all" ? "Все платформы" : p });
    b.addEventListener("click", function () {
      filter.platform = p;
      Array.prototype.forEach.call(chips.children, function (c) { c.setAttribute("aria-pressed", String(c === b)); });
      applyFilter();
    });
    chips.appendChild(b);
  });
  bar.appendChild(chips);
  var toggles = el("div", { class: "chips" });
  [["onlyNew", "Только новое"], ["onlyHigh", "Только важное"]].forEach(function (t) {
    var b = el("button", { class: "chip", type: "button", "aria-pressed": "false", text: t[1] });
    b.addEventListener("click", function () {
      filter[t[0]] = !filter[t[0]]; b.setAttribute("aria-pressed", String(filter[t[0]])); applyFilter();
    });
    toggles.appendChild(b);
  });
  if (!allCases().some(function (x) { return x.c.new; })) toggles.firstChild.classList.add("hidden");
  bar.appendChild(toggles);
  var copyBtn = el("button", { class: "btn primary", type: "button", text: "Скопировать отчёт" });
  copyBtn.addEventListener("click", copyReport);
  var saveBtn = el("button", { class: "btn", type: "button", text: "Скачать отчёт" });
  saveBtn.addEventListener("click", downloadReport);
  var resetBtn = el("button", { class: "btn", type: "button", text: "Сбросить отметки" });
  resetBtn.addEventListener("click", function () {
    if (!confirm("Сбросить все отметки и комментарии?")) return;
    results = {}; save(); render();
  });
  bar.appendChild(el("div", { class: "chips" }, [copyBtn, saveBtn, resetBtn]));

  function updateProgress() {
    var cases = allCases(), counts = { ok: 0, bug: 0, block: 0, skip: 0 };
    cases.forEach(function (x) { var s = statusOf(x.c.id); if (counts[s] !== undefined) counts[s]++; });
    var total = cases.length || 1, done = counts.ok + counts.bug + counts.block + counts.skip;
    var track = progress.firstChild; track.textContent = "";
    [["ok", "--ok"], ["bug", "--bug"], ["block", "--block"], ["skip", "--skip"]].forEach(function (p) {
      var w = counts[p[0]] / total * 100;
      if (w > 0) { var s = el("span"); s.style.width = w + "%"; s.style.background = "var(" + p[1] + ")"; track.appendChild(s); }
    });
    progress.lastChild.textContent = "Проверено " + done + " из " + cases.length +
      " · OK " + counts.ok + " · Баг " + counts.bug + " · Блокер " + counts.block + " · Пропуск " + counts.skip;
    (data.sections || []).forEach(function (s) {
      var n = document.querySelector('[data-toc="' + s.id + '"] .n'); if (!n) return;
      var cs = s.cases || [], d = cs.filter(function (c) { return statusOf(c.id); }).length;
      n.textContent = d + "/" + cs.length; n.classList.toggle("done", cs.length > 0 && d === cs.length);
    });
  }

  function caseCard(sec, c) {
    var card = el("article", { class: "card case", id: "case-" + c.id, "data-status": statusOf(c.id) });
    var badges = el("div", { class: "badges" });
    if (c.new) badges.appendChild(el("span", { class: "badge new", text: "Новое" }));
    if (c.priority) badges.appendChild(el("span", { class: "badge" + (c.priority === "high" ? " high" : ""), text: PRIORITY_TEXT[c.priority] || c.priority }));
    (c.platforms || []).forEach(function (p) { badges.appendChild(el("span", { class: "badge", text: p })); });
    var status = el("div", { class: "status", role: "group", "aria-label": "Результат" });
    var comment = el("textarea", { class: "comment", placeholder: "Комментарий: что не так, версия, устройство…" });
    comment.value = (results[c.id] && results[c.id].comment) || "";
    comment.addEventListener("input", function () {
      results[c.id] = results[c.id] || {}; results[c.id].comment = comment.value; save();
    });
    STATUS.forEach(function (s) {
      var b = el("button", { type: "button", "data-v": s.v, "aria-pressed": String(statusOf(c.id) === s.v), text: s.label });
      b.addEventListener("click", function () {
        results[c.id] = results[c.id] || {};
        results[c.id].status = statusOf(c.id) === s.v ? "" : s.v;
        save();
        card.setAttribute("data-status", results[c.id].status);
        Array.prototype.forEach.call(status.children, function (x) { x.setAttribute("aria-pressed", String(x.getAttribute("data-v") === results[c.id].status)); });
        if ((s.v === "bug" || s.v === "block") && results[c.id].status) comment.focus();
        updateProgress();
      });
      status.appendChild(b);
    });
    card.appendChild(el("div", { class: "case-head" }, [
      el("div", null, [
        el("div", { class: "case-title" }, [el("span", { class: "case-id", text: c.id }), document.createTextNode(c.title || "")]),
        badges
      ]),
      status
    ]));
    card.appendChild(el("div", { class: "cols" }, [
      el("div", null, [el("h5", { text: "Шаги" }), list("ol", c.steps)]),
      el("div", null, [el("h5", { text: "Ожидаемый результат" }), list("ul", c.expected)])
    ]));
    if (c.note) card.appendChild(el("div", { class: "note", text: c.note }));
    card.appendChild(comment);
    return card;
  }

  function render() {
    var main = document.getElementById("main"), toc = document.getElementById("toc");
    main.textContent = ""; toc.textContent = "";
    if ((data.general || []).length) {
      main.appendChild(el("div", { class: "card general" }, data.general.map(function (g) {
        return el("div", null, [el("h3", { text: g.title }), list("ul", g.items)]);
      })));
    }
    toc.appendChild(el("div", { class: "group", text: "Разделы" }));
    (data.sections || []).forEach(function (s) {
      var a = el("a", { href: "#sec-" + s.id, "data-toc": s.id }, [el("span", { text: s.title }), el("span", { class: "n" })]);
      toc.appendChild(a);
      var sec = el("section", { class: "sec", id: "sec-" + s.id });
      sec.appendChild(el("div", { class: "sec-head" }, [el("h2", { text: s.title }), el("span", { class: "count", text: (s.cases || []).length + " кейс(ов)" })]));
      if (s.about) sec.appendChild(el("p", { class: "about", text: s.about }));
      var blocks = el("div", { class: "blocks" });
      if ((s.changes || []).length) {
        blocks.appendChild(el("div", { class: "card block" }, [el("h4", { text: "Что нового" }), list("ul", s.changes, function (ch) {
          return el("li", null, [ch.date ? el("span", { class: "date", text: ch.date }) : null, document.createTextNode(ch.text || "")]);
        })]));
      }
      if ((s.preconditions || []).length) blocks.appendChild(el("div", { class: "card block" }, [el("h4", { text: "Перед проверкой" }), list("ul", s.preconditions)]));
      if ((s.limits || []).length) blocks.appendChild(el("div", { class: "card block limits" }, [el("h4", { text: "Не баг — известные ограничения" }), list("ul", s.limits)]));
      if (blocks.children.length) sec.appendChild(blocks);
      (s.cases || []).forEach(function (c) { sec.appendChild(caseCard(s, c)); });
      sec.appendChild(el("div", { class: "empty hidden", text: "Под выбранный фильтр кейсов нет." }));
      main.appendChild(sec);
    });
    applyFilter();
    updateProgress();
  }

  function applyFilter() {
    (data.sections || []).forEach(function (s) {
      var shown = 0;
      (s.cases || []).forEach(function (c) {
        var node = document.getElementById("case-" + c.id), v = visible(c);
        if (node) node.classList.toggle("hidden", !v);
        if (v) shown++;
      });
      var sec = document.getElementById("sec-" + s.id);
      if (sec) sec.querySelector(".empty").classList.toggle("hidden", shown > 0 || !(s.cases || []).length);
    });
  }

  function reportText() {
    var lines = ["# " + (data.title || "Бриф QA") + " — результаты", ""];
    metaRows.forEach(function (r) { lines.push("- " + r[0] + ": " + r[1]); });
    var cases = allCases(), counts = { ok: 0, bug: 0, block: 0, skip: 0, "": 0 };
    cases.forEach(function (x) { counts[statusOf(x.c.id)]++; });
    lines.push("- Итог: OK " + counts.ok + ", Баг " + counts.bug + ", Блокер " + counts.block +
      ", Пропуск " + counts.skip + ", не проверено " + counts[""] + " из " + cases.length, "");
    var problems = cases.filter(function (x) { var s = statusOf(x.c.id); return s === "bug" || s === "block"; });
    if (problems.length) {
      lines.push("## Проблемы", "");
      problems.forEach(function (x) {
        var r = results[x.c.id] || {};
        lines.push("- **" + STATUS_TEXT[r.status] + "** " + x.c.id + " " + x.c.title + " (" + x.sec.title + ")" +
          (r.comment ? " — " + r.comment.replace(/\s+/g, " ").trim() : ""));
      });
      lines.push("");
    }
    lines.push("## Все кейсы", "");
    (data.sections || []).forEach(function (s) {
      lines.push("### " + s.title);
      (s.cases || []).forEach(function (c) {
        var r = results[c.id] || {};
        lines.push("- [" + STATUS_TEXT[r.status || ""] + "] " + c.id + " " + c.title +
          (r.comment && r.status !== "bug" && r.status !== "block" ? " — " + r.comment.replace(/\s+/g, " ").trim() : ""));
      });
      lines.push("");
    });
    return lines.join("\n");
  }
  function copyReport() {
    var text = reportText();
    function fallback() {
      var ta = el("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Отчёт скопирован"); } catch (e) { toast("Не удалось скопировать — скачайте отчёт"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Отчёт скопирован"); }, fallback);
    } else fallback();
  }
  function downloadReport() {
    var blob = new Blob([reportText()], { type: "text/markdown;charset=utf-8" });
    var a = el("a", { href: URL.createObjectURL(blob), download: (data.id || "qa-brief") + "-report.md" });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  render();
})();
</script>
</body>
</html>
