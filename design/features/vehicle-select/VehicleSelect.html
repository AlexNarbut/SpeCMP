<!-- @dsCard group="Выбор автомобиля" viewport="480x1000" name="Выбор автомобиля (mobile)" subtitle="Compact 412×840 — каталог по шагам, поиск, CAN-код, карточка; light & dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Выбор автомобиля (mobile)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1180px; padding: 0 12px; }
  .seg { flex: 0 1 auto; max-width: 100%; box-sizing: border-box; display: flex; flex-wrap: nowrap; background: #fff; border-radius: 18px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg.wrap { flex-wrap: wrap; justify-content: center; }
  .seg button { white-space: nowrap; border: none; background: transparent; padding: 7px 12px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  #root { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .scaler { transform-origin: top left; }
  .theme-fab { position: fixed; top: 14px; right: 14px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-size: 22px; line-height: 1; background: #fff; color: #1A3E7A; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  body.page-dark { background: #070B14; }
  body.page-dark .seg { background: #1A2335; }
  body.page-dark .seg button { color: #C3CCDD; }
  body.page-dark .seg button.on { background: #9fc2ff; color: #0b1b36; }
  body.page-dark .theme-fab { background: #1A2335; color: #ffd966; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/app-kit/PhoneFrame.jsx"></script>
<script src="./vs-data.js"></script>
<script type="text/babel" src="./VsKit.jsx"></script>
<script type="text/babel" src="./VehicleCard.jsx"></script>
<script type="text/babel" src="./VehicleSelect.jsx"></script>
<script type="text/babel">
  function App() {
    const c = useVsCtl();
    return (
      <React.Fragment>
        {c.bar}
        <window.AndroidDevice dark={c.dark} width={412} height={840}>
          <div data-theme={c.dark ? "dark" : undefined} style={{ height: "100%" }}>
            <window.VehicleSelectApp key={c.key} {...c.props} onBack={() => window.psGo("home")} />
          </div>
        </window.AndroidDevice>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
