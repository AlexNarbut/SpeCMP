
<!-- @dsCard group="Расширенный монтаж" viewport="480x1000" name="Расширенный монтаж (mobile)" subtitle="Compact 412×840 — шапка блока + плитки разделов; профили блока, состояния, CAN; light & dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Расширенный монтаж (mobile)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .scaler { transform-origin: top left; }

</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../../res/icons/main-icons.js"></script>
<script src="../../res/icons/section-icons.js"></script>
<script type="text/babel" src="../../components/app-kit/PhoneFrame.jsx"></script>
<script type="text/babel" src="./AdvancedMount.jsx"></script>
<script type="text/babel">
  const PROFILE_OPTS = [["alarm","Сигнализация CAN"],["module","Модуль USB"],["legacy","Не поддерживается"]];
  const STATE_OPTS = [["ready","Готово"],["loading","Загрузка"],["error","Ошибка"],["denied","Доступ запрещён"],["empty","Пусто"],["lost","Связь потеряна"],["can","CAN-диалог"]];
  function Seg({ items, value, onChange }) {
    return <div className="seg">{items.map(([k, l]) => <button key={k} className={value === k ? "on" : ""} onClick={() => onChange(k)}>{l}</button>)}</div>;
  }
  function useCtl() {
    const [dark, setDark] = React.useState(false);
    const [profile, setProfile] = React.useState(new URLSearchParams(location.search).get("profile") || "alarm");
    const [st, setSt] = React.useState("ready");
    const [factory, setFactory] = React.useState(true);
    const [unread, setUnread] = React.useState(0);
    const p = AM_PROFILES[profile];
    const props = {
      profile, initialState: st === "lost" || st === "can" ? (profile === "legacy" ? "unsupported" : "ready") : (st === "ready" && profile === "legacy" ? "unsupported" : st),
      canFactory: factory, unread, showCanDialog: st === "can", lostTransport: st === "lost" ? p.transport : undefined,
    };
    const bar = (
      <React.Fragment>
        <div className="toolbar">
          <Seg items={[["l","Светлая"],["d","Тёмная"]]} value={dark ? "d" : "l"} onChange={(v) => setDark(v === "d")} />
          <Seg items={PROFILE_OPTS} value={profile} onChange={setProfile} />
          <Seg items={[["y","CAN: заводской"],["n","CAN: обновлён"]]} value={factory ? "y" : "n"} onChange={(v) => setFactory(v === "y")} />
          <Seg items={[["0","Чат: нет новых"],["3","Чат: 3"]]} value={String(unread)} onChange={(v) => setUnread(+v)} />
        </div>
        <div className="toolbar"><Seg items={STATE_OPTS} value={st} onChange={setSt} /></div>
      </React.Fragment>
    );
    return { dark, props, bar, key: [profile, st, factory, unread].join() };
  }

  function App() {
    const c = useCtl();
    return (
      <React.Fragment>
        {c.bar}
        <window.AndroidDevice dark={c.dark} width={412} height={840}>
          <div data-theme={c.dark ? "dark" : undefined} style={{ height: "100%" }}>
            <window.AdvancedMountScreen key={c.key} {...c.props} onBack={() => window.psGo("device-select")} />
          </div>
        </window.AndroidDevice>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
