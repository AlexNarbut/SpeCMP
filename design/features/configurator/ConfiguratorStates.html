<!-- @dsCard group="Конфигуратор" viewport="1200x900" name="Конфигуратор — состояния" subtitle="K8: все экраны, диалоги и состояния K1–K9 сеткой в выбранном окне и теме" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Конфигуратор — состояния</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1180px; padding: 0 12px; }
  .seg { flex: 0 1 auto; max-width: 100%; box-sizing: border-box; display: flex; flex-wrap: nowrap; background: #fff; border-radius: 18px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg.wrap { flex-wrap: wrap; justify-content: center; }
  .seg button { white-space: nowrap; border: none; background: transparent; padding: 7px 12px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #444; }
  .seg button.on { background: #1A3E7A; color: #fff; }
  #root { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .scaler { transform-origin: top left; }
  .theme-fab { position: fixed; top: 14px; right: 14px; z-index: 100; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-size: 22px; line-height: 1; background: #fff; color: #1A3E7A; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  body.page-dark { background: #101314; }
  body.page-dark .seg { background: #272b2d; }
  body.page-dark .seg button { color: #c7cccf; }
  body.page-dark .seg button.on { background: #9fc2ff; color: #0b1b36; }
  body.page-dark .theme-fab { background: #272b2d; color: #ffd966; }
  .grid { display: grid; gap: 24px 20px; justify-content: center; padding: 8px 20px; box-sizing: border-box; width: 100%; }
  .cell { display: flex; flex-direction: column; gap: 8px; }
  .cap { font-size: 14px; font-weight: 600; color: #222; }
  body.page-dark .cap { color: #dde2e6; }
  .frame { border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.25); background: var(--background); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../vehicle-select/vs-data.js"></script>
<script type="text/babel" src="../vehicle-select/VsKit.jsx"></script>
<script type="text/babel" src="../vehicle-select/VehicleCard.jsx"></script>
<script type="text/babel" src="../vehicle-select/VehicleSelect.jsx"></script>
<script type="text/babel" src="../device-settings/DeviceSettings.jsx"></script>
<script src="./cfg-data.js"></script>
<script type="text/babel" src="./CfgKit.jsx"></script>
<script type="text/babel" src="./Configurator.jsx"></script>
<script type="text/babel">
  const SIZES = { mobile: [412, 840, 0.6], tablet: [800, 1280, 0.34], desktop: [1280, 800, 0.42], min: [800, 600, 0.55] };
  function App() {
    const [dark, setDarkRaw] = React.useState(() => { try { return localStorage.getItem("ps-theme") === "dark"; } catch (e) { return false; } });
    const setDark = (v) => { setDarkRaw(v); try { localStorage.setItem("ps-theme", v ? "dark" : "light"); } catch (e) {} };
    React.useEffect(() => { document.body.classList.toggle("page-dark", dark); }, [dark]);
    const [size, setSize] = React.useState("mobile");
    const [grp, setGrp] = React.useState("K7/K9");
    const [blockOn, setBlockOn] = React.useState(true);
    const [writeMode, setWriteMode] = React.useState("disable");
    const [w, h, s] = SIZES[size];
    const groups = CFG_PRESETS.filter((g) => grp === "all" || g[0] === grp);
    return (
      <React.Fragment>
        <div className="toolbar">
          <VsSeg items={[["l","Светлая"],["d","Тёмная"]]} value={dark ? "d" : "l"} onChange={(x) => setDark(x === "d")} />
          <VsSeg items={[["mobile","Mobile 412×840"],["tablet","Планшет 800×1280"],["desktop","1280×800"],["min","Desktop min 800×600"]]} value={size} onChange={setSize} />
        </div>
        <div className="toolbar">
          <VsSeg items={[["all","Все"], ...CFG_PRESETS.map((g) => [g[0], g[0]])]} value={grp} onChange={setGrp} />
          <VsSeg items={[["on","Блок подключён"],["off","Блока нет"]]} value={blockOn ? "on" : "off"} onChange={(x) => setBlockOn(x === "on")} />
          <VsSeg items={[["hide","«Записать»: скрыт"],["disable","неактивен"]]} value={writeMode} onChange={setWriteMode} />
        </div>
        {groups.map((g) => (
          <React.Fragment key={g[0]}>
            <div className="cap" style={{ fontSize: 18, padding: "16px 0 0" }}>{g[0]}</div>
            <div className="grid" style={{ gridTemplateColumns: `repeat(auto-fill, ${Math.round(w * s)}px)` }}>
              {g[1].map(([k, cap]) => (
                <div className="cell" key={k}>
                  <div className="cap">{cap}</div>
                  <div style={{ width: w * s, height: h * s }}>
                    <div className="scaler frame" data-theme={dark ? "dark" : undefined} style={{ width: w, height: h, transform: `scale(${s})` }}>
                      <window.ConfiguratorApp key={size + k + blockOn + writeMode} demo={k} blockOn={blockOn} writeMode={writeMode} />
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </React.Fragment>
        ))}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
