<!-- @dsCard group="Выбор устройства" viewport="480x1000" name="Выбор устройства (mobile)" subtitle="Android/iOS Compact 412×840 — запрос разрешений, поиск, список BLE/USB, подключение; light & dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Выбор устройства (mobile)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../../components/app-kit/PhoneFrame.jsx"></script>
<script type="text/babel" src="./DeviceSelect.jsx"></script>
<script type="text/babel">
  const STEPS = [
    { key: "permission", label: "Разрешения" },
    { key: "denied",     label: "Отклонено" },
    { key: "adapterOff", label: "BT выкл." },
    { key: "scanning",   label: "Поиск" },
    { key: "list",       label: "Список" },
    { key: "empty",      label: "Пусто" },
    { key: "connecting", label: "Подключение" },
  ];
  function MobileApp() {
    const [dark, setDark] = React.useState(false);
    const [platform, setPlatform] = React.useState("android");
    const [step, setStep] = React.useState("permission");
    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={platform === "android" ? "on" : ""} onClick={() => setPlatform("android")}>Android</button>
            <button className={platform === "ios" ? "on" : ""} onClick={() => setPlatform("ios")}>iOS</button>
          </div>
        </div>
        <div className="toolbar">
          <div className="seg">
            {STEPS.map((s) => (
              <button key={s.key} className={step === s.key ? "on" : ""} onClick={() => setStep(s.key)}>{s.label}</button>
            ))}
          </div>
        </div>
        <window.AndroidDevice dark={dark} width={412} height={840}>
          <div data-theme={dark ? "dark" : undefined} style={{ height: "100%" }}>
            <window.DeviceSelectScreen
              key={platform + step}
              platform={platform}
              initialStep={step}
              demoEmpty={step === "empty"}
              onBack={() => window.psGo("home")}
              onConnected={(d) => window.psGo("advanced-mount", d.transport === "usb" ? "module" : "alarm")}
            />
          </div>
        </window.AndroidDevice>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<MobileApp />);
</script>
</body>
</html>
