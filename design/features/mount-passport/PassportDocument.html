<!-- @dsCard group="Паспорт монтажа" viewport="1400x1200" name="Документ A4" subtitle="PDF A4 книжная, поля 15 мм, ч/б печать — полный (3 стр.), минимальный, без блока, длинный (4 стр., перенос таблицы); RU/EN" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Паспорт монтажа: документ A4</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #D9DEE6; min-height: 100vh; padding: 20px 24px 48px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 24px; }
  .seg { display: flex; flex-wrap: wrap; background: #fff; border-radius: 18px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 14px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .pages { display: flex; flex-wrap: wrap; gap: 32px; justify-content: safe center; align-items: flex-start; }
  a { color: #1A3E7A; } a:hover { color: #07203F; }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .pages { display: block; }
    .pd-page { box-shadow: none !important; break-after: page; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./PassportDoc.jsx"></script>
<script type="text/babel">
  function Seg({ value, onChange, options }) {
    return <div className="seg">{options.map(([k, l]) => <button key={k} className={value === k ? "on" : ""} onClick={() => onChange(k)}>{l}</button>)}</div>;
  }
  function App() {
    const read = () => { try { return JSON.parse(localStorage.getItem("pd-host") || "{}"); } catch (e) { return {}; } };
    const [s, setS] = React.useState(() => ({ variant: "full", lang: "ru", guides: false, ...read() }));
    const set = (k) => (v) => setS((x) => { const n = { ...x, [k]: v }; localStorage.setItem("pd-host", JSON.stringify(n)); return n; });
    return (
      <React.Fragment>
        <div className="toolbar">
          <Seg value={s.variant} onChange={set("variant")} options={[["full", "Полный · 3 стр."], ["min", "Минимальный"], ["noblock", "Без блока"], ["long", "Длинный · 4 стр."]]} />
          <Seg value={s.lang} onChange={set("lang")} options={[["ru", "RU"], ["en", "EN"]]} />
          <Seg value={s.guides ? "on" : "off"} onChange={(v) => set("guides")(v === "on")} options={[["off", "Как в PDF"], ["on", "Поля и место логотипа"]]} />
        </div>
        <div className="pages">{window.PassportDocPages(s)}</div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
