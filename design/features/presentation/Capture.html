<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — кадры для презентации</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; padding: 40px; box-sizing: border-box; }
  .row { display: flex; gap: 60px; align-items: flex-start; margin-bottom: 80px; }
  .shot { padding: 40px; background: transparent; }
  .tablet { background: #1b1d1e; border-radius: 36px; padding: 20px; box-sizing: content-box; }
  .tablet .screen { border-radius: 16px; overflow: hidden; background: var(--background); }
  .win { border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .titlebar { height: 40px; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface-container); color: var(--on-surface); border-bottom: 1px solid var(--outline-variant); font-size: 13px; font-weight: 500; }
  .titlebar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
<script>window.CS_BASE = "../check-state/"; window.AM_BASE = "../advanced-mount/";</script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../../res/icons/main-icons.js"></script>
<script type="text/babel" src="../../components/app-kit/PhoneFrame.jsx"></script>
<script type="text/babel" src="../home/HomeScreens.jsx"></script>
<script type="text/babel" src="../home/Home.jsx"></script>
<script type="text/babel" src="../advanced-mount/AdvancedMount.jsx"></script>
<script type="text/babel" src="../device-settings/DeviceSettings.jsx"></script>
<script src="../vehicle-select/vs-data.js"></script>
<script type="text/babel" src="../vehicle-select/VsKit.jsx"></script>
<script type="text/babel" src="../vehicle-select/VehicleCard.jsx"></script>
<script type="text/babel" src="../vehicle-select/VehicleSelect.jsx"></script>
<script src="../configurator/cfg-data.js"></script>
<script type="text/babel" src="../configurator/CfgKit.jsx"></script>
<script type="text/babel" src="../configurator/Configurator.jsx"></script>
<script type="text/babel" src="../check-state/CheckState.jsx?v=3"></script>
<script type="text/babel" src="../fast-mount/FastMount.jsx?v=3"></script>
<script type="text/babel">
  const noop = () => {};
  const SCREENS = {
    "01-home": { title: "Главная", r: (d, dark) => <window.HomeApp dark={dark} onDark={noop} cardVariant="centered" profile="full" initialMenuOpen={false} /> },
    "02-advanced-mount": { title: "Расширенный монтаж", r: () => <window.AdvancedMountScreen profile="alarm" initialState="ready" canFactory={true} unread={0} onBack={noop} /> },
    "03-settings": { title: "Настройки устройства", r: () => <window.DeviceSettingsScreen canFactory={true} failWrite={false} seedEdits={true} onBack={noop} /> },
    "04-what-changes": { title: "Конфигуратор", r: () => <window.ConfiguratorApp entry="block" demo="diff-many" blockOn={true} writeMode="hide" net="ok" fileState="ok" saveFail={false} blockEdits={false} onBack={noop} /> },
    "05-check-system": { title: "Быстрый монтаж", r: () => <window.FastMountApp preset="F12" conn="ble" bypassResult="clone" server="ok" onHome={noop} /> },
  };
  const DEV = { mobile: [412, 915], tablet: [800, 1280], desktop: [1280, 800] };
  function Frame({ id, dev, dark }) {
    const s = SCREENS[id]; const [w, h] = DEV[dev]; const th = dark ? "dark" : undefined;
    const body = s.r(dev, dark);
    let inner;
    if (dev === "mobile") inner = <window.AndroidDevice dark={dark} width={w} height={h}><div data-theme={th} style={{ height: "100%" }}>{body}</div></window.AndroidDevice>;
    else if (dev === "tablet") inner = <div className="tablet"><div className="screen" data-theme={th} style={{ width: w, height: h }}>{body}</div></div>;
    else inner = <div className="win" data-theme={th} style={{ width: w, height: h + 40 }}>
      <div className="titlebar"><i style={{ background: "#ff5f57" }}></i><i style={{ background: "#febc2e" }}></i><i style={{ background: "#28c840" }}></i><span style={{ marginLeft: 8 }}>Pandora Spec — {s.title}</span></div>
      <div style={{ flex: 1, minHeight: 0, background: "var(--background)" }}>{body}</div></div>;
    return <div className="shot" id={`${id}-${dev}-${dark ? "dark" : "light"}`}>{inner}</div>;
  }
  function App() {
    return Object.keys(SCREENS).map((id) => [false, true].map((dark) => <div className="row" key={id + dark}>{["mobile", "tablet", "desktop"].map((dv) => <Frame key={dv} id={id} dev={dv} dark={dark} />)}</div>));
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
