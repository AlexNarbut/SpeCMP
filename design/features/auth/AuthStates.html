<!-- @dsCard group="Авторизация" viewport="1180x900" name="Auth (состояния)" subtitle="Галерея всех экранов × состояний, EN/RU, light & dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Авторизация (состояния)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; min-height: 100vh; padding: 20px 24px 48px; box-sizing: border-box; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 12px; margin: -8px -8px 16px; background: rgba(201,204,206,.92); backdrop-filter: blur(6px); }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #444; }
  .seg button.on { background: #1A3E7A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 8px 16px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .group { max-width: 1280px; margin: 0 auto 12px; }
  .group h2 { font-size: 18px; font-weight: 600; color: #1c1f20; margin: 22px 4px 12px; display: flex; align-items: baseline; gap: 10px; }
  .group h2 small { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: #5b5f61; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 22px 18px; }
  .tile { display: flex; flex-direction: column; gap: 8px; }
  .frameWrap { width: 232px; height: 412px; align-self: center; }
  .frame { width: 380px; height: 675px; border-radius: 18px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.18); border: 1px solid rgba(0,0,0,.12); transform: scale(0.6105); transform-origin: top left; }
  .cap { text-align: center; font-family: var(--font-sans); }
  .cap .s { font-size: 13px; font-weight: 600; color: #1c1f20; }
  .cap .st { font-family: var(--font-mono); font-size: 11px; color: #5b5f61; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="./i18n.js"></script>
<script type="text/babel" src="./AuthScreens.jsx"></script>
<script type="text/babel" src="./Auth.jsx"></script>
<script type="text/babel">
  const GROUPS = [
    { key: "root", label: "Auth Root", note: "проверка сессии" },
    { key: "login", label: "Login", note: "вход" },
    { key: "register", label: "Registration", note: "регистрация установщика" },
    { key: "forgot", label: "Forgot Password", note: "восстановление" },
    { key: "loggedIn", label: "Logged-in Placeholder", note: "временный экран + logout" },
  ];

  function GalleryApp() {
    const [dark, setDark] = React.useState(false);
    const [lang, setLang] = React.useState("en");
    return (
      <React.Fragment>
        <div className="bar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
            <button className={lang === "ru" ? "on" : ""} onClick={() => setLang("ru")}>RU</button>
          </div>
          <button className="link" onClick={() => window.psGo("auth")}>Прототип →</button>
          <button className="link" onClick={() => window.psGo("auth-flow")}>Поток →</button>
        </div>

        {GROUPS.map((g) => (
          <div className="group" key={g.key}>
            <h2>{g.label} <small>{g.note}</small></h2>
            <div className="grid">
              {window.AUTH_STATES[g.key].map((st) => (
                <div className="tile" key={st}>
                  <div className="frameWrap">
                    <div className="frame" data-theme={dark ? "dark" : undefined}>
                      <window.AuthPinned screen={g.key} state={st} lang={lang} setLang={() => {}} mode="compact" />
                    </div>
                  </div>
                  <div className="cap">
                    <div className="s">{g.label}</div>
                    <div className="st">{st}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<GalleryApp />);
</script>
</body>
</html>
