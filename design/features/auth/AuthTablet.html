<!-- @dsCard group="Авторизация" viewport="900x900" name="Auth (tablet)" subtitle="Планшет — портрет 800×1280 (medium) и ландшафт 1280×800 (expanded), EN/RU, light & dark" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Авторизация (tablet)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 820px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 8px 16px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .picker { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .chip { border: 1px solid #b9bcbe; background: #fff; border-radius: 999px; padding: 6px 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .chip.on { background: #1A3E7A; color: #fff; border-color: #1A3E7A; }
  .tablet { background: #1b1d1e; border-radius: 28px; padding: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.32); box-sizing: content-box; }
  .screen { border-radius: 14px; overflow: hidden; background: var(--background); }
  .scaler { transform-origin: top left; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="./i18n.js"></script>
<script type="text/babel" src="./AuthScreens.jsx"></script>
<script type="text/babel" src="./Auth.jsx"></script>
<script type="text/babel">
  const SIZES = { portrait: { w: 800, h: 1280 }, landscape: { w: 1280, h: 800 } };
  const SCREENS = ["root", "login", "register", "forgot", "loggedIn"];
  const SCREEN_LABEL = { root: "Root", login: "Login", register: "Register", forgot: "Forgot", loggedIn: "Logged-in" };

  function TabletApp() {
    const [dark, setDark] = React.useState(false);
    const [lang, setLang] = React.useState("en");
    const [orient, setOrient] = React.useState("portrait");
    const [demo, setDemo] = React.useState(true);
    const [screen, setScreen] = React.useState("login");
    const [state, setState] = React.useState("empty");
    const { w, h } = SIZES[orient];
    const pinMode = orient === "portrait" ? "medium" : "expanded";

    const states = window.AUTH_STATES[screen];
    React.useEffect(() => { if (!states.includes(state)) setState(states[0]); }, [screen]);
    const pickScreen = (s) => { setScreen(s); setState(window.AUTH_STATES[s][0]); };

    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => {
        const availW = window.innerWidth - 64;
        const availH = window.innerHeight - 220;
        setScale(Math.min(1, availW / w, availH / h));
      };
      fit();
      window.addEventListener("resize", fit);
      return () => window.removeEventListener("resize", fit);
    }, [w, h]);

    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={orient === "portrait" ? "on" : ""} onClick={() => setOrient("portrait")}>Портрет 800×1280</button>
            <button className={orient === "landscape" ? "on" : ""} onClick={() => setOrient("landscape")}>Ландшафт 1280×800</button>
          </div>
          <div className="seg">
            <button className={demo ? "on" : ""} onClick={() => setDemo(true)}>Прототип</button>
            <button className={!demo ? "on" : ""} onClick={() => setDemo(false)}>Состояния</button>
          </div>
          <div className="seg">
            <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
            <button className={lang === "ru" ? "on" : ""} onClick={() => setLang("ru")}>RU</button>
          </div>
          <button className="link" onClick={() => window.psGo("auth")}>Mobile →</button>
          <button className="link" onClick={() => window.psGo("auth-desktop")}>Desktop →</button>
        </div>

        {!demo && (
          <React.Fragment>
            <div className="picker">
              {SCREENS.map((s) => (
                <button key={s} className={"chip" + (screen === s ? " on" : "")} onClick={() => pickScreen(s)}>{SCREEN_LABEL[s]}</button>
              ))}
            </div>
            <div className="picker">
              {states.map((st) => (
                <button key={st} className={"chip" + (state === st ? " on" : "")} onClick={() => setState(st)}>{st}</button>
              ))}
            </div>
          </React.Fragment>
        )}

        <div style={{ width: (w + 32) * scale, height: (h + 32) * scale }}>
          <div className="scaler" style={{ transform: `scale(${scale})` }}>
            <div className="tablet">
              <div className="screen" data-theme={dark ? "dark" : undefined} style={{ width: w, height: h }}>
                {demo ? (
                  <window.AuthFlow key={"flow-" + orient + lang} lang={lang} onLang={setLang} initialScreen="login" />
                ) : (
                  <window.AuthPinned key={screen + state + orient} screen={screen} state={state} lang={lang} setLang={setLang} mode={pinMode} />
                )}
              </div>
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<TabletApp />);
</script>
</body>
</html>
