
<!-- @dsCard group="Устройства системы и приживление" viewport="1400x1000" name="Устройства системы · Приживление — лист состояний" subtitle="U1–U7 и D1–D13 статичными кадрами 412×840; переключатель темы, строки A/B/C и режима приживления" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Устройства системы — все состояния</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1100px; padding: 0 12px; }
  .seg { flex: 0 0 auto; max-width: 100%; box-sizing: border-box; display: flex; flex-wrap: nowrap; background: #fff; border-radius: 18px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg.wrap { flex-wrap: wrap; justify-content: center; }
  .seg button { white-space: nowrap; border: none; background: transparent; padding: 8px 14px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #444; }
  .seg button.on { background: #1A3E7A; color: #fff; }
  .hint { font-size: 13px; color: #3a3f44; }
  .scaler { transform-origin: top left; }
  .tablet { background: #1b1d1e; border-radius: 28px; padding: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.32); box-sizing: content-box; }
  .screen { border-radius: 14px; overflow: hidden; background: var(--background); }
  body.page-dark { background: #101314; }
  body.page-dark .seg { background: #272b2d; }
  body.page-dark .seg button { color: #c7cccf; }
  body.page-dark .seg button.on { background: #9fc2ff; color: #0b1b36; }
  body.page-dark .hint { color: #aab2b8; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="./PeripheralDevices.jsx"></script>
<script type="text/babel">
  const S = 0.62;
  function Frame({ label, dark, children }) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        <span className="hint" style={{ fontWeight: 600, fontSize: 14 }}>{label}</span>
        <div style={{ width: 412 * S, height: 840 * S, borderRadius: 18, overflow: "hidden", boxShadow: "0 8px 24px rgba(0,0,0,.2)", background: "#000" }}>
          <div className="scaler" style={{ width: 412, height: 840, transform: `scale(${S})` }}>
            <div data-theme={dark ? "dark" : undefined} style={{ width: 412, height: 840 }}>{children}</div>
          </div>
        </div>
      </div>
    );
  }
  function App() {
    const q = new URLSearchParams(location.search);
    const [dark, setDark] = React.useState(q.get("theme") === "dark");
    const row = "A";
    const [pv, setPv] = React.useState("card");
    React.useEffect(() => { document.body.classList.toggle("page-dark", dark); }, [dark]);
    const noop = () => {};
    const grid = { display: "flex", flexWrap: "wrap", gap: 24, justifyContent: "center", maxWidth: 1400, padding: "0 16px" };
    const H = ({ children }) => <h2 style={{ fontFamily: "var(--font-sans)", fontSize: 22, margin: "24px 0 4px", color: dark ? "#e6e8ea" : "#1d2124" }}>{children}</h2>;
    return (
      <React.Fragment>
        <div className="toolbar">
          <PdSeg items={[["l", "Светлая"], ["d", "Тёмная"]]} value={dark ? "d" : "l"} onChange={(v) => setDark(v === "d")} />
          <PdSeg items={[["card", "Приживление: карточка"], ["step", "Отдельный шаг"]]} value={pv} onChange={setPv} />
        </div>
        <H>Устройства системы</H>
        <div style={grid}>
          {window.PD_U_PRESETS.map(([k, l]) => <Frame key={k + row} label={l} dark={dark}><window.SystemDevicesScreen preset={k} variant={row} phase2={k === "U7"} freeze onBack={noop} onOpenPairing={noop} /></Frame>)}
          <Frame key={"ph2" + row} label="U4 Поморгать / Обновить" dark={dark}><window.SystemDevicesScreen preset="U4" variant={row} phase2 freeze onBack={noop} /></Frame>
        </div>
        <H>Приживление устройств</H>
        <div style={grid}>
          {window.PD_D_PRESETS.map(([k, l]) => <Frame key={k + pv} label={l} dark={dark}><window.PairingScreen preset={k} pairVariant={pv} freeze onBack={noop} onOpenDevices={noop} /></Frame>)}
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
