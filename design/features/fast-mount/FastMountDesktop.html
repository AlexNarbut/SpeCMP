
<!-- @dsCard group="Быстрый монтаж" viewport="1000x800" name="Быстрый монтаж (desktop)" subtitle="Окно 1280×800 и минимальное 800×600 — колонка шагов, hover/focus" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec — Быстрый монтаж (desktop)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1100px; padding: 0 12px; }
  .seg { flex: 0 1 auto; max-width: 100%; box-sizing: border-box; display: flex; flex-wrap: nowrap; background: #fff; border-radius: 18px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg.wrap { flex-wrap: wrap; justify-content: center; }
  .seg button { white-space: nowrap; border: none; background: transparent; padding: 8px 14px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .hint { font-size: 13px; color: #3a3f44; }
  .scaler { transform-origin: top left; }
  .tablet { background: #0E1424; border-radius: 28px; padding: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.32); box-sizing: content-box; }
  .win { background: #2a2e30; border-radius: 12px; padding: 0; box-shadow: 0 30px 80px rgba(0,0,0,.32); overflow: hidden; }
  .win .bar { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #cfd4d7; font-size: 13px; }
  .win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #5a6064; display: inline-block; }
  .screen { overflow: hidden; background: var(--background); }
  .tablet .screen { border-radius: 14px; }
  body.page-dark { background: #070B14; }
  body.page-dark .seg { background: #1A2335; }
  body.page-dark .seg button { color: #C3CCDD; }
  body.page-dark .seg button.on { background: #9fc2ff; color: #0b1b36; }
  body.page-dark .hint { color: #A3B0C8; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
<script>window.CS_BASE = "../check-state/";</script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="../check-state/CheckState.jsx?v=3"></script>
<script type="text/babel" src="../mount-passport/PassportDoc.jsx"></script>
<script type="text/babel" src="../mount-passport/PassportEditor.jsx"></script>
<script type="text/babel" src="../mount-passport/PassportRead.jsx"></script>
<script type="text/babel" src="../mount-passport/PassportReady.jsx"></script>
<script type="text/babel" src="../mount-passport/PassportTransfer.jsx"></script>
<script type="text/babel" src="../mount-passport/PassportList.jsx"></script>
<script type="text/babel" src="./FastMount.jsx?v=4"></script>
<script type="text/babel">
  const SIZES = {"std":{"w":1280,"h":800,"label":"Окно 1280×800"},"min":{"w":800,"h":600,"label":"Минимум 800×600"}};
  function App() {
    const c = useFmCtl();
    const [s, setS] = React.useState("std");
    const { w, h } = SIZES[s];
    const pad = 0, top = 32;
    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => setScale(Math.min(1, (window.innerWidth - 64) / (w + pad), (window.innerHeight - 240) / (h + pad + top)));
      fit(); window.addEventListener("resize", fit);
      return () => window.removeEventListener("resize", fit);
    }, [w, h]);
    return (
      <React.Fragment>
        {c.bar}
        <div className="toolbar"><FmSeg items={Object.entries(SIZES).map(([k, v]) => [k, v.label])} value={s} onChange={setS} /></div>
        <div style={{ width: (w + pad) * scale, height: (h + pad + top) * scale }}>
          <div className="scaler" style={{ transform: `scale(${scale})` }}>
            <div className="win">
              <div className="bar"><i></i><i></i><i></i><span style={{ marginLeft: 8 }}>Pandora Spec</span></div>
              <div className="screen" data-theme={c.dark ? "dark" : undefined} style={{ width: w, height: h }}>
                <window.FastMountApp key={s + c.key} {...c.props} onHome={() => window.psGo("home-desktop")} />
              </div>
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
