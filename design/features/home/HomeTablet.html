<!-- @dsCard group="Главный экран" viewport="900x900" name="Главный (tablet)" subtitle="Планшет — портрет 800×1280 (Medium) и ландшафт 1280×800 (Expanded), меню как панель" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Спец — Главный экран (tablet)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 14px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 8px 14px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .tablet { background: #1b1d1e; border-radius: 28px; padding: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.32); box-sizing: content-box; }
  .screen { border-radius: 14px; overflow: hidden; background: var(--background); }
  .scaler { transform-origin: top left; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../../res/icons/main-icons.js"></script>
<script src="../../res/icons/section-icons.js"></script>
<script type="text/babel" src="../app-update/AppUpdateScreen.jsx"></script>
<script type="text/babel" src="./HomeScreens.jsx"></script>
<script type="text/babel" src="./Home.jsx"></script>
<script type="text/babel">
  const SIZES = { portrait: { w: 800, h: 1280 }, landscape: { w: 1280, h: 800 } };

  function TabletApp() {
    const [dark, setDark] = React.useState(true);
    const [orient, setOrient] = React.useState("portrait");
    const [variant, setVariant] = React.useState("centered");
    const [profile, setProfile] = React.useState("full");
    const [reloadKey, setReloadKey] = React.useState(0);
    const { w, h } = SIZES[orient];

    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => {
        const availW = window.innerWidth - 64;
        const availH = window.innerHeight - 220;
        setScale(Math.min(1, availW / w, availH / h));
      };
      fit();
      window.addEventListener("resize", fit);
      return () => window.removeEventListener("resize", fit);
    }, [w, h]);

    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={orient === "portrait" ? "on" : ""} onClick={() => setOrient("portrait")}>Портрет 800×1280</button>
            <button className={orient === "landscape" ? "on" : ""} onClick={() => setOrient("landscape")}>Ландшафт 1280×800</button>
          </div>
          <div className="seg">
            <button className={variant === "centered" ? "on" : ""} onClick={() => setVariant("centered")}>Карточки: центр</button>
            <button className={variant === "leading" ? "on" : ""} onClick={() => setVariant("leading")}>слева</button>
          </div>
          <div className="seg">
            <button className={profile === "full" ? "on" : ""} onClick={() => setProfile("full")}>Профиль полный</button>
            <button className={profile === "partial" ? "on" : ""} onClick={() => setProfile("partial")}>неполный</button>
          </div>
          <button className="link" onClick={() => setReloadKey((k) => k + 1)}>↻ Загрузка</button>
          <button className="link" onClick={() => window.psGo("home")}>Mobile →</button>
          <button className="link" onClick={() => window.psGo("home-desktop")}>Desktop →</button>
          <button className="link" onClick={() => window.psGo("home-parts")}>Компоненты →</button>
        </div>

        <div style={{ width: (w + 32) * scale, height: (h + 32) * scale }}>
          <div className="scaler" style={{ transform: `scale(${scale})` }}>
            <div className="tablet">
              <div className="screen" data-theme={dark ? "dark" : undefined} style={{ width: w, height: h }}>
                <window.HomeApp key={orient + reloadKey} dark={dark} onDark={setDark} cardVariant={variant} profile={profile} initialMenuOpen={orient === "landscape"} />
              </div>
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<TabletApp />);
</script>
</body>
</html>
