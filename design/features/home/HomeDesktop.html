<!-- @dsCard group="Главный экран" viewport="900x640" name="Главный (desktop)" subtitle="Compose Desktop — Expanded 1100×760 и Large 1280×800, меню как боковая панель" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Спец — Главный экран (desktop)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 980px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 7px 13px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #4A5874; }
  .seg button.on { background: #0A1A3A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 7px 13px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .scaler { transform-origin: top left; }
  .win { border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.32); display: flex; flex-direction: column; }
  .titlebar { height: 38px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: var(--surface-container); color: var(--on-surface); border-bottom: 1px solid var(--outline-variant); }
  .title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .title .material-icons { font-size: 18px; color: var(--primary); }
  .wctl { display: flex; align-items: center; gap: 6px; }
  .wbtn { width: 28px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--on-surface-variant); cursor: pointer; }
  .wbtn .material-icons { font-size: 16px; }
  .cbody { flex: 1; min-height: 0; display: flex; background: var(--background); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../../res/icons/main-icons.js"></script>
<script src="../../res/icons/section-icons.js"></script>
<script type="text/babel" src="../app-update/AppUpdateScreen.jsx"></script>
<script type="text/babel" src="./HomeScreens.jsx"></script>
<script type="text/babel" src="./Home.jsx"></script>
<script type="text/babel">
  const SIZES = { expanded: { w: 1100, h: 760 }, large: { w: 1280, h: 800 } };

  function DesktopApp() {
    const [dark, setDark] = React.useState(true);
    const [size, setSize] = React.useState("large");
    const [menu, setMenu] = React.useState(true);
    const [variant, setVariant] = React.useState("centered");
    const [profile, setProfile] = React.useState("full");
    const [reloadKey, setReloadKey] = React.useState(0);
    const { w, h } = SIZES[size];

    const [scale, setScale] = React.useState(1);
    React.useEffect(() => {
      const fit = () => setScale(Math.min(1, (window.innerWidth - 48) / w, (window.innerHeight - 230) / h));
      fit();
      window.addEventListener("resize", fit);
      return () => window.removeEventListener("resize", fit);
    }, [w, h]);

    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={size === "expanded" ? "on" : ""} onClick={() => setSize("expanded")}>Expanded 1100×760</button>
            <button className={size === "large" ? "on" : ""} onClick={() => setSize("large")}>Large 1280×800</button>
          </div>
          <div className="seg">
            <button className={menu ? "on" : ""} onClick={() => setMenu(true)}>Меню открыто</button>
            <button className={!menu ? "on" : ""} onClick={() => setMenu(false)}>закрыто</button>
          </div>
          <div className="seg">
            <button className={variant === "centered" ? "on" : ""} onClick={() => setVariant("centered")}>Карточки: центр</button>
            <button className={variant === "leading" ? "on" : ""} onClick={() => setVariant("leading")}>слева</button>
          </div>
          <div className="seg">
            <button className={profile === "full" ? "on" : ""} onClick={() => setProfile("full")}>Профиль полный</button>
            <button className={profile === "partial" ? "on" : ""} onClick={() => setProfile("partial")}>неполный</button>
          </div>
          <button className="link" onClick={() => setReloadKey((k) => k + 1)}>↻ Загрузка</button>
          <button className="link" onClick={() => window.psGo("home")}>Mobile →</button>
          <button className="link" onClick={() => window.psGo("home-tablet")}>Планшет →</button>
          <button className="link" onClick={() => window.psGo("app-update")}>Обновление →</button>
          <button className="link" onClick={() => window.psGo("home-parts")}>Компоненты →</button>
        </div>

        <div style={{ width: w * scale, height: h * scale }}>
          <div className="scaler" style={{ transform: `scale(${scale})` }}>
            <div className="win" data-theme={dark ? "dark" : undefined} style={{ width: w, height: h }}>
              <div className="titlebar">
                <div className="title"><span className="material-icons">build</span>Pandora Спец</div>
                <div className="wctl">
                  <div className="wbtn"><span className="material-icons">remove</span></div>
                  <div className="wbtn"><span className="material-icons">crop_square</span></div>
                  <div className="wbtn"><span className="material-icons">close</span></div>
                </div>
              </div>
              <div className="cbody">
                <window.HomeApp key={size + menu + reloadKey} platform="desktop" dark={dark} onDark={setDark} cardVariant={variant} profile={profile} initialMenuOpen={menu} />
              </div>
            </div>
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<DesktopApp />);
</script>
</body>
</html>
