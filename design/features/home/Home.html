<!-- @dsCard group="Главный экран" viewport="480x1000" name="Главный (mobile)" subtitle="Android Compact 412×915 — рабочая панель монтажника, светлая и тёмная тема" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Спец — Главный экран (mobile)</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 16px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #444; }
  .seg button.on { background: #1A3E7A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 8px 16px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .hint { font-family: var(--font-mono); font-size: 11px; color: #5b5f61; text-align: center; max-width: 400px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script src="../../res/icons/main-icons.js"></script>
<script type="text/babel" src="../../components/app-kit/PhoneFrame.jsx"></script>
<script type="text/babel" src="./HomeScreens.jsx"></script>
<script type="text/babel" src="./Home.jsx"></script>
<script type="text/babel">
  function MobileApp() {
    const [dark, setDark] = React.useState(true);
    const [variant, setVariant] = React.useState("centered");
    const [profile, setProfile] = React.useState("full");
    const [reloadKey, setReloadKey] = React.useState(0);

    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          <div className="seg">
            <button className={variant === "centered" ? "on" : ""} onClick={() => setVariant("centered")}>Карточки: центр</button>
            <button className={variant === "leading" ? "on" : ""} onClick={() => setVariant("leading")}>слева</button>
          </div>
          <div className="seg">
            <button className={profile === "full" ? "on" : ""} onClick={() => setProfile("full")}>Профиль полный</button>
            <button className={profile === "partial" ? "on" : ""} onClick={() => setProfile("partial")}>неполный</button>
          </div>
          <button className="link" onClick={() => setReloadKey((k) => k + 1)}>↻ Загрузка</button>
          <button className="link" onClick={() => window.psGo("home-tablet")}>Планшет →</button>
          <button className="link" onClick={() => window.psGo("home-desktop")}>Desktop →</button>
          <button className="link" onClick={() => window.psGo("home-parts")}>Компоненты →</button>
        </div>
        <div className="hint">Меню открывается кнопкой слева в топбаре (modal со scrim). Переключение темы и «Обновить базу» — внутри меню.</div>

        <window.AndroidDevice dark={dark} width={412} height={840}>
          <div data-theme={dark ? "dark" : undefined} style={{ height: "100%" }}>
            <window.HomeApp key={reloadKey} dark={dark} onDark={setDark} cardVariant={variant} profile={profile} />
          </div>
        </window.AndroidDevice>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<MobileApp />);
</script>
</body>
</html>
