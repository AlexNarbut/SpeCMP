<!-- @dsCard group="Brand" viewport="700x230" name="Light & dark" subtitle="Every screen must work in both themes" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); padding: 20px; background: #cfd2d4; display: flex; gap: 18px; }
  .pane { flex: 1; border-radius: 16px; overflow: hidden; border: 1px solid rgba(0,0,0,.12); }
  .scr { background: var(--background); color: var(--on-background); padding: 16px; height: 170px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .bar { font-size: 18px; font-weight: 500; }
  .card { background: var(--surface-container); border-radius: 12px; padding: 12px; }
  .ct { font-size: 14px; font-weight: 500; }
  .cs { font-size: 12px; color: var(--on-surface-variant); }
  .btn { align-self: flex-start; background: var(--primary); color: var(--on-primary); border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 500; }
  .tag { font-family: var(--font-mono); font-size: 11px; padding: 8px 12px; background: rgba(0,0,0,.06); }
</style>
</head>
<body>
<div class="pane">
  <div class="tag">LIGHT</div>
  <div class="scr">
    <div class="bar">Калькулятор</div>
    <div class="card"><div class="ct">Точка подключения</div><div class="cs">CAN-H · X14</div></div>
    <div class="btn">Сохранить</div>
  </div>
</div>
<div class="pane">
  <div class="tag" style="background: #2A3142; color: #9AA4B8;">DARK</div>
  <div class="scr" data-theme="dark">
    <div class="bar">Калькулятор</div>
    <div class="card"><div class="ct">Точка подключения</div><div class="cs">CAN-H · X14</div></div>
    <div class="btn">Сохранить</div>
  </div>
</div>
</body>
</html>
