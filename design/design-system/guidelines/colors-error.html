<!-- @dsCard group="Colors" viewport="700x150" name="Error & Surfaces" subtitle="error container · background · surfaceVariant · outline" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); padding: 16px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; height: 110px; border-radius: 12px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--outline-variant); }
  .name { font-size: 13px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
  .on { font-size: 11px; opacity: .9; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background: var(--error); color: var(--on-error);">
    <div><div class="name">error</div><div class="hex">#C62828</div></div>
    <div class="on">onError</div>
  </div>
  <div class="sw" style="background: var(--error-container); color: var(--on-error-container);">
    <div><div class="name">errorContainer</div><div class="hex">#FBDAD7</div></div>
    <div class="on">onErrorContainer</div>
  </div>
  <div class="sw" style="background: var(--surface-variant); color: var(--on-surface-variant);">
    <div><div class="name">surfaceVariant</div><div class="hex">#E1E1E1</div></div>
    <div class="on">onSurfaceVariant</div>
  </div>
  <div class="sw" style="background: var(--background); color: var(--on-background); border-color: var(--outline);">
    <div><div class="name">background</div><div class="hex">#ECECEC</div></div>
    <div class="on">outline · #BDBDBD</div>
  </div>
</div>
</body>
</html>
