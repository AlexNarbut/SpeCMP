<!-- @dsCard group="Colors" viewport="700x150" name="Secondary & Tertiary" subtitle="secondary · tertiary containers" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); padding: 16px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; height: 110px; border-radius: 12px; padding: 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--outline-variant); }
  .name { font-size: 13px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: .85; }
  .on { font-size: 11px; opacity: .9; }
</style>
</head>
<body>
<div class="row">
  <div class="sw" style="background: var(--secondary); color: var(--on-secondary);">
    <div><div class="name">secondary</div><div class="hex">#3F5A82</div></div>
    <div class="on">onSecondary</div>
  </div>
  <div class="sw" style="background: var(--secondary-container); color: var(--on-secondary-container);">
    <div><div class="name">secondaryContainer</div><div class="hex">#DAE3F3</div></div>
    <div class="on">onSecondaryContainer</div>
  </div>
  <div class="sw" style="background: var(--tertiary); color: var(--on-tertiary);">
    <div><div class="name">tertiary</div><div class="hex">#2C6A6E</div></div>
    <div class="on">onTertiary</div>
  </div>
  <div class="sw" style="background: var(--tertiary-container); color: var(--on-tertiary-container);">
    <div><div class="name">tertiaryContainer</div><div class="hex">#C9EAEC</div></div>
    <div class="on">onTertiaryContainer</div>
  </div>
</div>
</body>
</html>
