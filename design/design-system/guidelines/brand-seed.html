<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark & seed" subtitle="Pandora Spec · seed #2C3639 generates the M3 palette" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 24px; display: flex; align-items: center; gap: 28px; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .glyph { width: 56px; height: 56px; border-radius: 14px; background: var(--seed); color: #fff; display: grid; place-items: center; }
  .glyph .material-icons { font-size: 32px; }
  .word { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  .word b { color: var(--seed); }
  .seed { display: flex; flex-direction: column; gap: 8px; }
  .chip { width: 120px; height: 56px; border-radius: 10px; background: var(--seed); color: #fff; font-family: var(--font-mono); font-size: 12px; display: grid; place-items: center; }
  .note { font-size: 12px; color: var(--on-surface-variant); max-width: 220px; }
</style>
</head>
<body>
<div class="mark">
  <div class="glyph"><span class="material-icons">build</span></div>
  <div class="word">Pandora <b>Spec</b></div>
</div>
<div class="seed">
  <div class="chip">seed · #2C3639</div>
  <div class="note">Базовый цвет генерирует все роли Material 3 для светлой и тёмной тем (materialkolor).</div>
</div>
</body>
</html>
