<!-- @dsCard group="Spacing" viewport="700x180" name="Sizes & touch targets" subtitle="Touch 48 · button 40 · field 56 · top bar 64 · nav 80" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 20px; }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { background: var(--primary-container); border: 1px solid var(--primary); border-radius: 8px; width: 56px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--on-surface-variant); text-align: center; }
  .note { margin-top: 14px; font-size: 12px; color: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="height: var(--button-height); width: 48px;"></div><div class="cap">button<br/>40</div></div>
  <div class="item"><div class="box" style="height: var(--touch-min); width: 48px;"></div><div class="cap">touch<br/>48</div></div>
  <div class="item"><div class="box" style="height: var(--field-height); width: 48px;"></div><div class="cap">field<br/>56</div></div>
  <div class="item"><div class="box" style="height: var(--topbar-height); width: 48px;"></div><div class="cap">top bar<br/>64</div></div>
  <div class="item"><div class="box" style="height: var(--navbar-height); width: 48px;"></div><div class="cap">nav bar<br/>80</div></div>
  <div class="item"><div class="box" style="height: var(--icon-size); width: 24px;"></div><div class="cap">icon<br/>24</div></div>
</div>
<div class="note">Минимальная зона касания — 48 × 48 dp. Критично для монтажников с малочувствительными пальцами.</div>
</body>
</html>
