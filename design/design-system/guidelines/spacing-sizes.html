<!-- @dsCard group="Spacing" viewport="700x220" name="Высоты контролов" subtitle="Все ≥ 48 dp" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; padding: 16px; display: flex; gap: 12px; }
  .th { flex: 1; min-width: 0; padding: 16px; border-radius: 12px; background: var(--background-page-primary); color: var(--foreground-on-dark-primary-default); display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--foreground-on-dark-secondary-default); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; min-width: 0; height: 72px; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px; font-weight: 700; border: 1px solid var(--border-highlight); }
  .tk { font-family: var(--font-mono); font-size: 10px; font-weight: 400; opacity: .75; }
  .h{display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--background-surface-highlight);border:1px solid var(--border-light);font-size:12px;font-weight:700;padding:0 10px;white-space:nowrap}
</style>
</head>
<body>
<div class="th"><div class="row" style="align-items:flex-end;flex-wrap:wrap"><div class="h" style="height:var(--h-button-s)">S 48</div><div class="h" style="height:var(--h-button-m)">M 52</div><div class="h" style="height:var(--h-button-l)">L 56</div><div class="h" style="height:var(--h-button-xl)">XL 64</div><div class="h" style="height:var(--h-hold)">Hold 64</div><div class="h" style="height:var(--h-input)">Input 72</div><div class="h" style="height:var(--h-list-item)">List 80</div><div class="h" style="height:var(--h-info-row)">Info 88</div></div></div></body></html>
