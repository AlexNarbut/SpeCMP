<!-- @dsCard group="Colors" viewport="700x200" name="Бренд" subtitle="brand-primary · default / hover / pressed / highlight" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; padding: 16px; display: flex; gap: 12px; }
  .th { flex: 1; min-width: 0; padding: 16px; border-radius: 12px; background: var(--background-page-primary); color: var(--foreground-on-dark-primary-default); display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--foreground-on-dark-secondary-default); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; min-width: 0; height: 72px; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px; font-weight: 700; border: 1px solid var(--border-highlight); }
  .tk { font-family: var(--font-mono); font-size: 10px; font-weight: 400; opacity: .75; }
  
</style>
</head>
<body>
<div class="th"><div class="cap">Светлая</div><div class="row"><div class="sw" style="background: var(--brand-primary-default); color: #fff;">Default<span class="tk">#2F6BFF</span></div><div class="sw" style="background: var(--brand-primary-hover); color: #fff;">Hover<span class="tk">hover</span></div><div class="sw" style="background: var(--brand-primary-pressed); color: #fff;">Pressed<span class="tk">pressed</span></div><div class="sw" style="background: var(--brand-primary-highlight); color: var(--foreground-on-dark-primary-default);">Highlight<span class="tk">фон выбранного</span></div><div class="sw" style="background: var(--brand-secondary-default); color: #fff;">Secondary<span class="tk">#23A3F7</span></div></div></div>
<div class="th" data-theme="dark"><div class="cap">Тёмная</div><div class="row"><div class="sw" style="background: var(--brand-primary-default); color: #fff;">Default<span class="tk">#2F6BFF</span></div><div class="sw" style="background: var(--brand-primary-hover); color: #fff;">Hover<span class="tk">hover</span></div><div class="sw" style="background: var(--brand-primary-pressed); color: #fff;">Pressed<span class="tk">pressed</span></div><div class="sw" style="background: var(--brand-primary-highlight); color: var(--foreground-on-dark-primary-default);">Highlight<span class="tk">фон выбранного</span></div><div class="sw" style="background: var(--brand-secondary-default); color: #fff;">Secondary<span class="tk">#23A3F7</span></div></div></div>
</body>
</html>
