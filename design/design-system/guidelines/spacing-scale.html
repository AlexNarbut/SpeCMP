<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #E6EBF3; padding: 16px; display: flex; gap: 12px; }
  .th { flex: 1; min-width: 0; padding: 16px; border-radius: 12px; background: var(--background-page-primary); color: var(--foreground-on-dark-primary-default); display: flex; flex-direction: column; gap: 10px; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--foreground-on-dark-secondary-default); }
  .row { display: flex; gap: 6px; }
  .sw { flex: 1; min-width: 0; height: 72px; border-radius: 8px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; font-size: 11px; font-weight: 700; border: 1px solid var(--border-highlight); }
  .tk { font-family: var(--font-mono); font-size: 10px; font-weight: 400; opacity: .75; }
  .bar{height:16px;background:var(--brand-primary-default);border-radius:3px} .l{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700} .l span{width:64px;font-family:var(--font-mono);font-weight:400}
</style>
</head>
<body>
<div class="th"><div class="l"><span>space-4</span><div class="bar" style="width:16px"></div></div><div class="l"><span>space-8</span><div class="bar" style="width:32px"></div></div><div class="l"><span>space-12</span><div class="bar" style="width:48px"></div></div><div class="l"><span>space-16</span><div class="bar" style="width:64px"></div></div><div class="l"><span>space-20</span><div class="bar" style="width:80px"></div></div><div class="l"><span>space-24</span><div class="bar" style="width:96px"></div></div><div class="l"><span>space-32</span><div class="bar" style="width:128px"></div></div><div class="l"><span>space-56</span><div class="bar" style="width:224px"></div></div></div></body></html>
