<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Base 4dp grid — xs 4 · s 8 · m 12 · l 16 · xl 24 · xxl 32" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 20px; }
  .row { display: flex; align-items: flex-end; gap: 20px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--primary); border-radius: 4px; width: 100%; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="row">
  <div class="item" style="width: 40px;"><div class="bar" style="height: var(--space-xs);"></div><div class="cap">xs · 4</div></div>
  <div class="item" style="width: 48px;"><div class="bar" style="height: var(--space-s);"></div><div class="cap">s · 8</div></div>
  <div class="item" style="width: 56px;"><div class="bar" style="height: var(--space-m);"></div><div class="cap">m · 12</div></div>
  <div class="item" style="width: 64px;"><div class="bar" style="height: var(--space-l);"></div><div class="cap">l · 16</div></div>
  <div class="item" style="width: 80px;"><div class="bar" style="height: var(--space-xl);"></div><div class="cap">xl · 24</div></div>
  <div class="item" style="width: 96px;"><div class="bar" style="height: var(--space-xxl);"></div><div class="cap">xxl · 32</div></div>
</div>
</body>
</html>
