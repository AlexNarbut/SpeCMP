<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-container-low); color: var(--on-background); padding: 24px; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .lbl { font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: .07em; }
  .frame { border: 1px solid var(--outline-variant); border-radius: 12px; overflow: hidden; background: var(--background); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const DS = window.PandoraSpecDesignSystem_b8d6e1;
  const { CmpTopAppBar, CmpTabRow, CmpNavigationBar, CmpIconButton } = DS;
  const { useState } = React;
  function Demo() {
    const [tab, setTab] = useState(0);
    const [nav, setNav] = useState(0);
    return (
      <div className="col">
        <div className="lbl">Top app bar</div>
        <div className="frame">
          <CmpTopAppBar title="Калькулятор"
            navigationIcon={<CmpIconButton icon="ArrowBack" contentDescription="Назад" />}
            actions={<CmpIconButton icon="MoreVert" contentDescription="Ещё" />} />
        </div>
        <div className="lbl">Tabs</div>
        <div className="frame">
          <CmpTabRow tabs={[{ title: "Схема" }, { title: "Точки" }, { title: "Журнал" }]}
            selectedTabIndex={tab} onTabSelected={setTab} />
        </div>
        <div className="lbl">Bottom navigation</div>
        <div className="frame" style={{ maxWidth: 380 }}>
          <CmpNavigationBar items={[
            { icon: "Home", label: "Главная", selected: nav === 0, onClick: () => setNav(0) },
            { icon: "List", label: "Объекты", selected: nav === 1, onClick: () => setNav(1), badge: 3 },
            { icon: "Settings", label: "Настройки", selected: nav === 2, onClick: () => setNav(2) },
          ]} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
