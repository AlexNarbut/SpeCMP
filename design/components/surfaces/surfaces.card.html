<!-- @dsCard group="Components" viewport="700x300" name="Surfaces" subtitle="Card · Selectable card · Surface" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 24px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: .07em; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const DS = window.PandoraSpecDesignSystem_b8d6e1;
  const { CmpCard, CmpSelectableCard, CmpSurface, CmpText, CmpIcon, CmpRadioButton } = DS;
  const { useState } = React;
  function Demo() {
    const [sel, setSel] = useState(0);
    const models = ["Pandora DXL 5000", "Pandora DX 91"];
    return (
      <div className="col">
        <div className="lbl">Card (1dp shadow, medium radius)</div>
        <CmpCard style={{ padding: 16, maxWidth: 360 }}>
          <CmpText variant="titleMedium">Точка подключения</CmpText>
          <CmpText variant="bodyMedium" color="var(--on-surface-variant)">CAN-H · разъём X14 · контакт 6</CmpText>
        </CmpCard>
        <div className="lbl">Selectable cards (selected = primary)</div>
        <div className="col" style={{ maxWidth: 360 }}>
          {models.map((m, i) => (
            <CmpSelectableCard key={i} selected={sel === i} onClick={() => setSel(i)}
              icon={<CmpRadioButton selected={sel === i} />}>
              <CmpText variant="titleMedium">{m}</CmpText>
            </CmpSelectableCard>
          ))}
        </div>
        <div className="lbl">Surface (custom tile)</div>
        <CmpSurface color="var(--secondary-container)" contentColor="var(--on-secondary-container)" radius={16}
          style={{ width: 72, height: 72, display: "grid", placeItems: "center" }}>
          <CmpText variant="headlineSmall">÷</CmpText>
        </CmpSurface>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
