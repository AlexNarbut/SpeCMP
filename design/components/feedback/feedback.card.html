<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .lbl { font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; }
  .stage { position: relative; height: 220px; border: 1px solid var(--outline-variant); border-radius: 12px; overflow: hidden; background: var(--surface-container-low); }
  .badgerow { display: flex; gap: 28px; align-items: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const DS = window.PandoraSpecDesignSystem_b8d6e1;
  const { CmpDialog, CmpSnackbar, CmpBadge, CmpBadgedBox, CmpBottomSheet, CmpTextButton, CmpText, CmpIcon } = DS;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Dialog</div>
          <div className="stage">
            <CmpDialog open icon="Delete" title="Удалить объект?" text="Это действие необратимо."
              dismissButton={<CmpTextButton text="Отмена" />}
              confirmButton={<CmpTextButton text="Удалить" />} />
          </div>
        </div>
        <div>
          <div className="lbl">Bottom sheet</div>
          <div className="stage">
            <CmpBottomSheet open>
              <CmpText variant="titleLarge">Выберите точку</CmpText>
              <div style={{ height: 12 }} />
              <CmpText variant="bodyMedium" color="var(--on-surface-variant)">CAN-H · CAN-L · IGN · ACC</CmpText>
            </CmpBottomSheet>
          </div>
        </div>
        <div>
          <div className="lbl">Snackbar</div>
          <CmpSnackbar message="Деление на ноль невозможно" actionLabel="OK" />
        </div>
        <div>
          <div className="lbl">Badge</div>
          <div className="badgerow">
            <CmpBadgedBox badge={<CmpBadge count={3} />}><CmpIcon icon="Notifications" size={28} /></CmpBadgedBox>
            <CmpBadgedBox badge={<CmpBadge count={12} />}><CmpIcon icon="Email" size={28} /></CmpBadgedBox>
            <CmpBadgedBox badge={<CmpBadge />}><CmpIcon icon="Settings" size={28} /></CmpBadgedBox>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
