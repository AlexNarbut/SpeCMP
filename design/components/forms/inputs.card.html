<!-- @dsCard group="Components" viewport="700x420" name="Inputs & Controls" subtitle="TextField · Dropdown · Switch · Checkbox · Radio · Slider" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .lbl { font-size: 11px; color: var(--on-surface-variant); text-transform: uppercase; letter-spacing: .07em; }
  .ctl { display: flex; align-items: center; gap: 8px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const DS = window.PandoraSpecDesignSystem_b8d6e1;
  const { CmpTextField, CmpDropdown, CmpSwitch, CmpCheckbox, CmpRadioButton, CmpSlider, CmpIcon, CmpText } = DS;
  const { useState } = React;
  function Demo() {
    const [vin, setVin] = useState("XW8ZZZ");
    const [model, setModel] = useState(null);
    const [sw1, setSw1] = useState(true);
    const [cb, setCb] = useState(true);
    const [radio, setRadio] = useState("can");
    const [val, setVal] = useState(6);
    return (
      <div className="grid">
        <div className="col">
          <div className="lbl">Text fields</div>
          <CmpTextField label="VIN автомобиля" value={vin} onChange={setVin} singleLine
            leadingIcon={<CmpIcon icon="Search" />} />
          <CmpTextField label="Ток, А" value="abc" isError singleLine
            supportingText="Введите число" trailingIcon={<CmpIcon icon="AlertCircle" />} />
          <div className="lbl">Dropdown</div>
          <CmpDropdown placeholder="Модель сигнализации"
            options={["Pandora DXL 5000", "Pandora DX 91", "Pandora VX 4G"]}
            selectedValue={model} onOptionSelected={(i, v) => setModel(v)} />
        </div>
        <div className="col">
          <div className="lbl">Switch · Checkbox · Radio</div>
          <div className="row">
            <div className="ctl"><CmpSwitch checked={sw1} onCheckedChange={setSw1} thumbIcon /><CmpText variant="bodyMedium">CAN-шина</CmpText></div>
          </div>
          <div className="row">
            <div className="ctl"><CmpCheckbox checked={cb} onCheckedChange={setCb} /><CmpText variant="bodyMedium">Проверено</CmpText></div>
            <div className="ctl"><CmpCheckbox indeterminate /><CmpText variant="bodyMedium">Частично</CmpText></div>
            <div className="ctl"><CmpCheckbox disabled /><CmpText variant="bodyMedium" color="var(--on-surface-variant)">Disabled</CmpText></div>
          </div>
          <div className="row">
            <div className="ctl"><CmpRadioButton selected={radio === "can"} onClick={() => setRadio("can")} /><CmpText variant="bodyMedium">CAN</CmpText></div>
            <div className="ctl"><CmpRadioButton selected={radio === "analog"} onClick={() => setRadio("analog")} /><CmpText variant="bodyMedium">Аналог</CmpText></div>
          </div>
          <div className="lbl">Slider — чувствительность: {val}</div>
          <CmpSlider value={val} min={0} max={10} step={1} onValueChange={setVal} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
