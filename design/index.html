<!-- @dsCard group="Главный экран" viewport="480x1000" name="Вход в приложение (index)" subtitle="Точка входа: не авторизован → auth flow, авторизован → главный экран; сессия в localStorage" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Pandora Spec</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #c9ccce; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 0 28px; box-sizing: border-box; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .seg { display: flex; background: #fff; border-radius: 999px; padding: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .seg button { border: none; background: transparent; padding: 8px 18px; border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #444; }
  .seg button.on { background: #1A3E7A; color: #fff; }
  .link { border: none; background: #fff; border-radius: 999px; padding: 8px 18px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; color: #1A3E7A; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .hint { font-family: var(--font-mono); font-size: 11px; color: #5b5f61; text-align: center; max-width: 460px; }
  a { color: #1A3E7A; } a:hover { color: #07203F; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="res/nav.js"></script>
</head>
<body>
<div id="root"></div>
<script src="_ds_bundle.js"></script>
<script src="features/auth/i18n.js"></script>
<script src="res/icons/main-icons.js"></script>
<script type="text/babel" src="components/app-kit/PhoneFrame.jsx"></script>
<script type="text/babel" src="features/auth/AuthScreens.jsx"></script>
<script type="text/babel" src="features/auth/Auth.jsx"></script>
<script type="text/babel" src="features/home/HomeScreens.jsx"></script>
<script type="text/babel" src="features/home/Home.jsx"></script>
<script type="text/babel">
  // App entry: session check → auth flow (not authorized) or main feature.
  // Session flag lives in localStorage so a refresh keeps you signed in.
  const AUTH_KEY = "ps-authed";

  function App() {
    const [dark, setDark] = React.useState(false);
    const [lang, setLang] = React.useState("ru");
    const [authed, setAuthed] = React.useState(() => localStorage.getItem(AUTH_KEY) === "1");
    const [sessionKey, setSessionKey] = React.useState(0); // remount on login/logout

    const onLoggedIn = () => {
      localStorage.setItem(AUTH_KEY, "1");
      setAuthed(true);
      setSessionKey((k) => k + 1);
    };
    const onLogout = () => {
      localStorage.removeItem(AUTH_KEY);
      setAuthed(false);
      setSessionKey((k) => k + 1);
    };

    return (
      <React.Fragment>
        <div className="toolbar">
          <div className="seg">
            <button className={dark ? "" : "on"} onClick={() => setDark(false)}>Светлая</button>
            <button className={dark ? "on" : ""} onClick={() => setDark(true)}>Тёмная</button>
          </div>
          {!authed && (
            <div className="seg">
              <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
              <button className={lang === "ru" ? "on" : ""} onClick={() => setLang("ru")}>RU</button>
            </div>
          )}
          <button className="link" onClick={onLogout}>↻ Сбросить сессию</button>
          <button className="link" onClick={() => window.psGo("index-tablet")}>Планшет →</button>
          <button className="link" onClick={() => window.psGo("index-desktop")}>Desktop →</button>
          <button className="link" onClick={() => window.psGo("home")}>Главный →</button>
          <button className="link" onClick={() => window.psGo("auth")}>Авторизация →</button>
          <button className="link" onClick={() => window.psGo("calculator")}>Калькулятор →</button>
          <button className="link" onClick={() => window.psGo("support-chat")}>Техподдержка →</button>
        </div>
        <div className="hint">
          {authed
            ? "Сессия активна → главный экран. «Выход» в меню (или «Сбросить сессию») возвращает на авторизацию."
            : "Сессии нет → auth flow: проверка сессии, затем вход. Успешный вход (любой email без «fail»/«new») сохраняет сессию и открывает главный экран."}
        </div>

        <window.AndroidDevice dark={dark} width={412} height={840}>
          <div data-theme={dark ? "dark" : undefined} style={{ height: "100%" }}>
            {authed
              ? <window.HomeApp key={"home" + sessionKey} dark={dark} onDark={setDark} onLogout={onLogout} />
              : <window.AuthFlow key={"auth" + sessionKey} initialScreen="root" lang={lang} onLang={setLang} onLoggedIn={onLoggedIn} />}
          </div>
        </window.AndroidDevice>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
