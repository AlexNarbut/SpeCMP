<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radius" subtitle="xs 4 · s 8 · m 12 · l 16 · xl 28" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 20px; }
  .row { display: flex; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 84px; height: 72px; background: var(--secondary-container); border: 1.5px solid var(--secondary); }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><div class="box" style="border-radius: var(--radius-xs);"></div><div class="cap">xs · 4</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-s);"></div><div class="cap">s · 8</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-m);"></div><div class="cap">m · 12</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-l);"></div><div class="cap">l · 16</div></div>
  <div class="item"><div class="box" style="border-radius: var(--radius-xl);"></div><div class="cap">xl · 28</div></div>
</div>
</body>
</html>
