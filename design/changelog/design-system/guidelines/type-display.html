<!-- @dsCard group="Type" viewport="700x180" name="Display & Headline" subtitle="Roboto — display 57/45/36, headline 32/28/24" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--background); color: var(--on-background); padding: 20px; }
  .spec { display: flex; flex-direction: column; gap: 6px; }
  .line { display: flex; align-items: baseline; gap: 14px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--on-surface-variant); width: 130px; flex: 0 0 auto; }
  .d-l { font-size: var(--display-large-size); line-height: 1.05; }
  .h-l { font-size: var(--headline-large-size); }
  .h-s { font-size: var(--headline-small-size); }
</style>
</head>
<body>
<div class="spec">
  <div class="line"><span class="meta">displayLarge 57</span><span class="d-l">Pandora Spec</span></div>
  <div class="line"><span class="meta">headlineLarge 32</span><span class="h-l">Установка сигнализации</span></div>
  <div class="line"><span class="meta">headlineSmall 24</span><span class="h-s">Заголовок секции экрана</span></div>
</div>
</body>
</html>
