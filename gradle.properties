#Gradle
# 8G: линк composeApp/linkReleaseFrameworkIosArm64 упирался в 6G после того,
# как Coil переехал в core/ui и попал в нативный граф всех бинарников.
org.gradle.jvmargs=-Xmx8G -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=10

#Kotlin
kotlin.daemon.jvmargs=-Xmx4G -XX:+UseG1GC
kotlin.native.binary.gc=cms
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.wasm=true
kotlin.native.ignoreDisabledTargets=true

#https://youtrack.jetbrains.com/issue/KT-82395
kotlin.incremental.js=false
kotlin.incremental.js.klib=false

#Android
android.useAndroidX=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
android.enableR8.fullMode=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
