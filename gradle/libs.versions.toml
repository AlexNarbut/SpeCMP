[versions]
jna = "5.14.0"

# Версия приложения — единственное место для всех платформ: Android (versionName/versionCode), desktop (packageVersion,
# version.properties), iOS (сборка Xcode пишет её в Info.plist — iosApp/scripts/set-app-version.sh).
app-versionName = "10.0.4"
app-versionCode = "1005"
