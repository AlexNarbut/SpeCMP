# Perfetto-конфиг композиционного трейса: события Compose (track_event, категория "rendering" —
# androidx.compose.runtime:runtime-tracing) плюс view-фазы кадра. Подаётся через stdin, плейсхолдеры заменяет bench.sh.
buffers { size_kb: 65536 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "track_event"
    # "*" включило бы SDK-события системных процессов (gfx) и замедлило бы приложение в разы.
    track_event_config { disabled_categories: "*" enabled_categories: "rendering" }
  }
}
data_sources {
  config {
    name: "linux.ftrace"
    ftrace_config {
      atrace_categories: "view"
      atrace_categories: "am"
      atrace_apps: "APP_ID_PLACEHOLDER"
    }
  }
}
data_sources {
  config {
    name: "linux.process_stats"
    process_stats_config { scan_all_processes_on_start: true proc_stats_poll_ms: 1000 }
  }
}
duration_ms: DURATION_PLACEHOLDER
